[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosswire"
version = "0.4.0"
description = "Detect semantic conflicts between parallel Git branches"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crosswire = "crosswire.cli:main"

[dependency-groups]
dev = ["pytest>=8", "jsonschema==4.25.1"]
eval = ["pyright==1.1.407", "jsonschema==4.25.1"]

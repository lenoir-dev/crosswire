[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "crosswire"
version = "0.1.0"
description = "Detect semantic conflicts between parallel Git branches"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
crosswire = "crosswire.cli:main"

[dependency-groups]
dev = ["pytest>=8"]
